name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
      
      - name: Initialize Capacitor
        run: |
          mkdir -p www
          cp -r index.html js styles icons manifest.json sw.js www/
          echo '{"appId":"com.stockapp.viewer","appName":"股票看盘","webDir":"www","server":{"androidScheme":"http"}}' > capacitor.config.json
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Accept Android SDK License
        run: yes | sdkmanager --licenses || true
      
      - name: Add Android Platform
        run: npx cap add android
      
      - name: Copy Web Assets
        run: npx cap copy
      
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stock-viewer-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
