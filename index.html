<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1890ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>股票看盘</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <!-- 顶部导航栏 -->
  <header class="header">
    <div class="header-title">
      <h1>股票看盘</h1>
    </div>
    <div class="header-actions">
      <select id="dataSourceSelect" class="data-source-select">
        <option value="mock">模拟数据</option>
        <option value="eastmoney">东方财富</option>
        <option value="sina">新浪财经</option>
      </select>
    </div>
  </header>

  <!-- 搜索区域 -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="搜索股票代码或名称..." autocomplete="off">
    <div id="searchResults" class="search-results"></div>
  </div>

  <!-- 当前股票信息 -->
  <div id="stockInfo" class="stock-info">
    <div class="stock-header">
      <span class="stock-name-large">--</span>
      <span class="stock-code-large">--</span>
    </div>
    <div class="price-info">
      <span class="current-price">--</span>
      <span class="price-change">--</span>
      <span class="price-percent">--</span>
    </div>
  </div>

  <!-- 操作按钮 -->
  <div class="action-buttons">
    <button id="addFavoriteBtn" class="action-btn">+自选</button>
    <button id="setReminderBtn" class="action-btn reminder-btn">设置提醒</button>
    <button id="viewRemindersBtn" class="action-btn list-btn">查看提醒</button>
  </div>

  <!-- K线周期切换 -->
  <div class="period-tabs">
    <button class="period-btn active" data-period="day">日K</button>
    <button class="period-btn" data-period="week">周K</button>
    <button class="period-btn" data-period="month">月K</button>
  </div>

  <!-- K线图区域 -->
  <div class="kline-container">
    <canvas id="klineCanvas"></canvas>
    <div id="klineTooltip" class="kline-tooltip"></div>
  </div>

  <!-- 自选股列表 -->
  <div class="favorites-section">
    <h3 class="section-title">自选股</h3>
    <div id="favoriteList" class="favorite-list">
      <div class="empty-tip">暂无自选股，搜索添加</div>
    </div>
  </div>

  <!-- 设置提醒弹窗 -->
  <div id="reminderModal" class="modal">
    <div class="modal-content">
      <h3 class="modal-title">设置价格提醒</h3>
      <div class="modal-body">
        <div class="reminder-stock-info">
          <span id="reminderStockName" class="stock-name">--</span>
          <span id="reminderStockCode" class="stock-code">--</span>
        </div>
        <div class="form-group">
          <label>提醒类型</label>
          <select id="reminderType" class="form-select">
            <option value="above">价格上涨高于</option>
            <option value="below">价格下跌低于</option>
          </select>
        </div>
        <div class="form-group">
          <label>目标价格</label>
          <input type="number" id="reminderTargetPrice" class="form-input" step="0.01" placeholder="输入目标价格">
          <div id="priceRangeTip" class="form-tip"></div>
        </div>
        <div class="form-group">
          <label>备注（可选）</label>
          <input type="text" id="reminderNote" class="form-input" placeholder="输入备注信息">
        </div>
      </div>
      <div class="modal-actions">
        <button id="reminderCancelBtn" class="btn-cancel">取消</button>
        <button id="reminderConfirmBtn" class="btn-confirm">确认</button>
      </div>
    </div>
  </div>

  <!-- 提醒列表弹窗 -->
  <div id="reminderListModal" class="modal">
    <div class="modal-content modal-list">
      <div class="modal-header">
        <h3 class="modal-title">价格提醒列表</h3>
        <button id="closeReminderListBtn" class="close-btn">×</button>
      </div>
      <div id="reminderListContent" class="modal-body"></div>
    </div>
  </div>

  <!-- 价格提醒弹窗 -->
  <div id="priceAlert" class="alert-modal">
    <div class="alert-content">
      <div class="alert-icon">🔔</div>
      <h3 id="alertTitle" class="alert-title">价格提醒</h3>
      <div id="alertContent" class="alert-body"></div>
      <div class="alert-actions">
        <button id="alertCloseBtn" class="btn-cancel">关闭</button>
        <button id="alertViewBtn" class="btn-confirm">查看详情</button>
      </div>
    </div>
  </div>

  <!-- Service Worker 注册 -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').then(() => {
        console.log('Service Worker 注册成功');
      }).catch(err => {
        console.log('Service Worker 注册失败:', err);
      });
    }
  </script>

  <script src="js/app.js"></script>
</body>
</html>
