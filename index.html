<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="智能记事本 - 自动解析提醒时间">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="智能记事本">
  <title>智能记事本</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.svg" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <div id="app">
    <!-- 头部导航 -->
    <header class="header">
      <h1 class="app-title">智能记事本</h1>
      <div class="header-actions">
        <button id="searchBtn" class="icon-btn" title="搜索">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>
        <button id="dateFilterBtn" class="icon-btn" title="按日期筛选">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM9 10H7v2h2v-2zm4 0h-2v2h2v-2zm4 0h-2v2h2v-2z"/>
          </svg>
        </button>
        <button id="moreBtn" class="icon-btn" title="更多">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
        </button>
        <button id="addBtn" class="icon-btn primary" title="新建笔记">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 日期筛选指示器 -->
    <div id="dateFilterIndicator" class="date-filter-indicator hidden">
      <span id="filterDateText"></span>
      <button id="clearDateFilterBtn" class="clear-filter-btn hidden">清除</button>
    </div>

    <!-- 搜索面板 -->
    <div id="searchPanel" class="search-panel hidden">
      <div class="modal-backdrop"></div>
      <div class="search-content">
        <div class="search-input-wrap">
          <input type="text" id="searchInput" placeholder="搜索笔记..." autocomplete="off">
          <button id="clearSearchBtn" class="clear-btn hidden">×</button>
        </div>
        <button id="closeSearchBtn" class="text-btn">取消</button>
      </div>
    </div>

    <!-- 日历面板 -->
    <div id="calendarPanel" class="calendar-panel hidden">
      <div class="modal-backdrop"></div>
      <div class="calendar-content">
        <div class="calendar-header-row">
          <button id="prevMonthBtn" class="cal-nav-btn">&lt;</button>
          <span id="calendarTitle" class="cal-title">2024年1月</span>
          <button id="nextMonthBtn" class="cal-nav-btn">&gt;</button>
          <button id="closeCalendarBtn" class="text-btn">关闭</button>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
      </div>
    </div>

    <!-- 更多菜单面板 -->
    <div id="morePanel" class="more-panel hidden">
      <div class="modal-backdrop"></div>
      <div class="more-content">
        <div class="more-header">
          <span>更多功能</span>
          <button id="closeMoreBtn" class="text-btn">关闭</button>
        </div>
        <div class="more-menu">
          <button id="exportBtn" class="more-item">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z"/>
            </svg>
            <span>导出记录</span>
          </button>
          <button id="importBtn" class="more-item">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
              <path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6-.67l2.59 2.58L17 12.5l-5-5-5 5 1.41 1.41L11 11.33V21h2z"/>
            </svg>
            <span>导入记录</span>
            <input type="file" id="importFile" accept=".json" hidden>
          </button>
        </div>
      </div>
    </div>

    <!-- 笔记列表 -->
    <main class="main-content">
      <div id="emptyState" class="empty-state hidden">
        <div class="empty-icon">📝</div>
        <p class="empty-text">暂无笔记</p>
        <p class="empty-hint">点击右上角 + 添加第一条笔记</p>
      </div>
      <ul id="noteList" class="note-list"></ul>
    </main>

    <!-- 编辑弹窗 -->
    <div id="editModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">新建笔记</h2>
          <button id="closeModalBtn" class="close-btn">×</button>
        </div>
        <div class="modal-body">
          <textarea id="noteContent" placeholder="输入笔记内容...&#10;&#10;试试输入：明天8点开会&#10;后天下午3点见客户&#10;周五晚上聚餐&#10;2小时后提醒我" rows="4"></textarea>
          
          <!-- 解析的提醒 -->
          <div id="parsedReminder" class="parsed-reminder hidden">
            <div class="reminder-info">
              <span class="reminder-icon">🔔</span>
              <span id="reminderTime" class="reminder-time"></span>
            </div>
            <button id="toggleReminderBtn" class="toggle-btn">启用</button>
          </div>
          
          <!-- 自定义时间 -->
          <div class="custom-time-row">
            <input type="datetime-local" id="customTimeInput" class="custom-time-input">
            <button id="setCustomBtn" class="small-btn">自定义时间</button>
          </div>
          
          <!-- 标记按钮 -->
          <button id="toggleMarkBtn" class="mark-btn">标记</button>
        </div>
        <div class="modal-footer">
          <button id="deleteNoteBtn" class="danger-btn hidden">删除</button>
          <button id="saveNoteBtn" class="primary-btn">保存</button>
        </div>
      </div>
    </div>

    <!-- 提醒权限弹窗 -->
    <div id="reminderModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content small">
        <div class="modal-header">
          <h2>开启提醒</h2>
          <button id="closeReminderModalBtn" class="close-btn">×</button>
        </div>
        <div class="modal-body">
          <p class="reminder-desc">为了收到提醒通知，请开启通知权限</p>
          <button id="requestNotifyBtn" class="primary-btn full-width">开启通知</button>
        </div>
      </div>
    </div>

    <!-- 提醒弹窗（到时提醒） -->
    <div id="reminderAlert" class="reminder-alert hidden">
      <div class="reminder-alert-content">
        <div class="reminder-alert-icon">🔔</div>
        <div class="reminder-alert-title">提醒时间到了！</div>
        <div id="reminderAlertContent" class="reminder-alert-text"></div>
        <div class="reminder-alert-actions">
          <button id="dismissReminderBtn" class="dismiss-btn">关闭</button>
          <button id="viewReminderBtn" class="view-btn">查看详情</button>
        </div>
      </div>
    </div>

    <!-- Toast 提示 -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
